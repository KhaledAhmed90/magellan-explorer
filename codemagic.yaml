workflows:
  android-apk:
    name: Magellan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build standalone Android web bundle (diagnostic)
        script: |
          set -o pipefail
          rm -f android-web-build.log
          {
            echo '=== MAGELLAN ANDROID WEB BUILD DIAGNOSTICS ==='
            date
            pwd
            node --version
            npm --version
            echo '--- package scripts ---'
            node -e "console.log(require('./package.json').scripts)"
            echo '--- Vite config ---'
            sed -n '1,240p' vite.android.config.ts
            echo '--- Capacitor config ---'
            sed -n '1,200p' capacitor.config.ts
            echo '--- running build ---'
            npm run build:android
            echo '--- build command succeeded ---'
            echo '--- output files ---'
            find .output -maxdepth 5 -type f -print 2>/dev/null | sort | head -300
            test -f .output/public/index.html
            echo '--- index.html ---'
            sed -n '1,80p' .output/public/index.html
            echo '=== WEB BUILD PASSED ==='
          } 2>&1 | tee android-web-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== WEB BUILD FAILED: AUTOMATIC ERROR SUMMARY ==='
            tail -n 120 android-web-build.log || true
            echo '=== END ERROR SUMMARY ==='
          fi
          exit "$status"
      - name: Generate Android project and sync (diagnostic)
        script: |
          set -o pipefail
          rm -f capacitor-build.log
          {
            echo '=== CAPACITOR DIAGNOSTICS ==='
            node --version
            npm --version
            npx cap --version
            sed -n '1,200p' capacitor.config.ts
            rm -rf android
            echo '--- cap add android ---'
            npx cap add android
            echo '--- cap sync android ---'
            npx cap sync android --verbose
            test -d android
            test -f android/app/build.gradle || test -f android/app/build.gradle.kts
            echo '=== CAPACITOR PASSED ==='
          } 2>&1 | tee capacitor-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== CAPACITOR FAILED: AUTOMATIC ERROR SUMMARY ==='
            grep -Ein 'error|err!|failed|cannot find|module not found|enoent|eacces|exception|caused by' capacitor-build.log | tail -n 80 || true
            echo '--- last 160 lines ---'
            tail -n 160 capacitor-build.log || true
            echo '=== END CAPACITOR ERROR SUMMARY ==='
          fi
          exit "$status"
      - name: Build debug APK
        script: |
          set -o pipefail
          rm -f gradle-build.log
          {
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
            test -f app/build/outputs/apk/debug/app-debug.apk
            ls -lah app/build/outputs/apk/debug/app-debug.apk
          } 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== GRADLE FAILED: AUTOMATIC ERROR SUMMARY ==='
            grep -Ein 'error|failed|exception|caused by|could not|unable to' ../gradle-build.log | tail -n 100 || true
            tail -n 160 ../gradle-build.log || true
          fi
          exit "$status"
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android-web-build.log
      - capacitor-build.log
      - gradle-build.log
