workflows:
  android-apk:
    name: Magellan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build standalone Android web bundle (diagnostic)
        script: |
          set -o pipefail
          rm -f android-web-build.log
          {
            echo '=== MAGELLAN ANDROID WEB BUILD DIAGNOSTICS ==='
            date
            pwd
            node --version
            npm --version
            echo '--- running build:android ---'
            npm run build:android
            echo '--- output files ---'
            find .output -maxdepth 6 -type f -print 2>/dev/null | sort | head -400
            test -f .output/public/index.html
            echo '=== WEB BUILD PASSED ==='
          } 2>&1 | tee android-web-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== WEB BUILD FAILED: AUTOMATIC ERROR SUMMARY ==='
            grep -Ein 'error|err!|failed|cannot find|module not found|enoent|eacces|exception|caused by' android-web-build.log | tail -n 100 || true
            tail -n 160 android-web-build.log || true
            echo '=== END ERROR SUMMARY ==='
          fi
          exit "$status"
      - name: Generate Android project and sync (diagnostic)
        script: |
          set -o pipefail
          rm -f capacitor-build.log
          {
            echo '=== CAPACITOR DIAGNOSTICS ==='
            node --version
            npm --version
            npx cap --version
            sed -n '1,200p' capacitor.config.ts
            rm -rf android
            echo '--- cap add android ---'
            npx cap add android
            echo '--- cap sync android ---'
            npx cap sync android --verbose
            test -d android
            test -f android/app/build.gradle || test -f android/app/build.gradle.kts
            echo '=== CAPACITOR PASSED ==='
          } 2>&1 | tee capacitor-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== CAPACITOR FAILED: AUTOMATIC ERROR SUMMARY ==='
            grep -Ein 'error|err!|failed|cannot find|module not found|enoent|eacces|exception|caused by' capacitor-build.log | tail -n 100 || true
            tail -n 160 capacitor-build.log || true
            echo '=== END CAPACITOR ERROR SUMMARY ==='
          fi
          exit "$status"
      - name: Build debug APK
        script: |
          set -o pipefail
          rm -f gradle-build.log
          {
            echo '=== GRADLE APK BUILD ==='
            cd android
            chmod +x gradlew
            echo '--- Gradle version ---'
            ./gradlew --version
            echo '--- Building debug APK ---'
            ./gradlew assembleDebug --no-daemon --stacktrace
            echo '--- Gradle command completed ---'
            echo '--- Searching for every generated APK ---'
            find . -type f -name '*.apk' -print | sort
            echo '--- Android build outputs ---'
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null | sort || true
            APK_PATH=$(find . -type f -name '*.apk' -print -quit)
            if [ -z "$APK_PATH" ]; then
              echo 'ERROR: Gradle completed but no APK file was generated.'
              echo '--- Gradle outputs directory ---'
              find . -maxdepth 8 -type d -path '*build*outputs*' -print 2>/dev/null | sort || true
              exit 1
            fi
            echo "FOUND APK: $APK_PATH"
            cp "$APK_PATH" ../magellan-debug.apk
            ls -lah ../magellan-debug.apk
            echo '=== APK BUILD PASSED ==='
          } 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== GRADLE FAILED: AUTOMATIC ERROR SUMMARY ==='
            grep -Ein 'error|failed|exception|caused by|could not|unable to|no such file|not found' ../gradle-build.log | tail -n 120 || true
            tail -n 200 ../gradle-build.log || true
            echo '=== END GRADLE ERROR SUMMARY ==='
          fi
          exit "$status"
    artifacts:
      - magellan-debug.apk
      - android-web-build.log
      - capacitor-build.log
      - gradle-build.log
