workflows:
  android-apk:
    name: Magellan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web application
        script: npm run build
      - name: Prepare Capacitor web assets
        script: |
          set -euxo pipefail
          echo '=== WEB BUILD DIAGNOSTICS ==='
          pwd
          node --version
          npm --version
          echo '--- capacitor config ---'
          cat capacitor.config.ts || true
          echo '--- output tree ---'
          find .output -maxdepth 5 -type f -print 2>/dev/null | sort | head -300 || true
          echo '--- HTML files ---'
          find . -type f -name '*.html' -not -path './node_modules/*' -print 2>/dev/null | sort | head -100 || true
          if [ -f '.output/public/index.html' ]; then
            WEB_DIR='.output/public'
          elif [ -f '.output/public/_shell.html' ]; then
            cp '.output/public/_shell.html' '.output/public/index.html'
            WEB_DIR='.output/public'
          elif [ -f 'dist/index.html' ]; then
            mkdir -p '.output/public'
            cp 'dist/index.html' '.output/public/index.html'
            WEB_DIR='.output/public'
          else
            HTML_FILE=$(find .output -type f -name '*.html' -print -quit 2>/dev/null || true)
            if [ -n "$HTML_FILE" ]; then
              mkdir -p '.output/public'
              cp "$HTML_FILE" '.output/public/index.html'
              WEB_DIR='.output/public'
            else
              echo 'ERROR: No HTML shell generated by npm run build.'
              exit 1
            fi
          fi
          test -f "$WEB_DIR/index.html"
          echo "WEB_DIR=$WEB_DIR"
          echo '=== END WEB DIAGNOSTICS ==='
      - name: Generate Android project
        script: |
          set -euxo pipefail
          echo '=== CAPACITOR DIAGNOSTICS ==='
          node --version
          npm --version
          npx cap --version
          echo '--- capacitor config ---'
          cat capacitor.config.ts
          echo '--- installed Capacitor packages ---'
          npm ls @capacitor/cli @capacitor/core @capacitor/android --depth=0 || true
          echo '--- pre-existing android directory ---'
          test -d android && find android -maxdepth 2 -type f -print | head -100 || echo 'android directory absent'
          rm -rf android
          echo '--- running cap add android ---'
          npx cap add android
          echo '--- cap add exit code: success ---'
          test -d android
          test -f android/settings.gradle || test -f android/settings.gradle.kts || true
          echo '--- android directory created ---'
          find android -maxdepth 3 -type f -print | sort | head -200
          echo '--- running cap sync android ---'
          npx cap sync android --verbose
          echo '=== CAPACITOR DIAGNOSTICS COMPLETE ==='
      - name: Build debug APK
        script: |
          set -euxo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
