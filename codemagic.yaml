workflows:
  android-apk:
    name: Magellan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Configure TanStack Start for static Android build
        script: |
          set -euxo pipefail
          echo '=== PATCHING VITE CONFIG FOR CAPACITOR ==='
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          old = '    // Redirect TanStack Start\'s bundled server entry to src/server.ts (our SSR error wrapper).\n    server: { entry: "server" },\n\n'
          if old in s:
              s = s.replace(old, '')
              p.write_text(s)
              print('Removed custom TanStack Start server entry for Android build.')
          else:
              print('Custom server entry already absent; leaving config unchanged.')
          PY
          cat vite.config.ts
      - name: Build web application
        script: npm run build
      - name: Prepare Capacitor web assets
        script: |
          set -euxo pipefail
          echo '=== WEB BUILD DIAGNOSTICS ==='
          pwd
          node --version
          npm --version
          echo '--- capacitor config ---'
          cat capacitor.config.ts || true
          echo '--- output tree ---'
          find .output -maxdepth 6 -type f -print 2>/dev/null | sort | head -400 || true
          echo '--- HTML files ---'
          find . -type f -name '*.html' -not -path './node_modules/*' -print 2>/dev/null | sort | head -100 || true
          if [ -f '.output/public/index.html' ]; then
            WEB_DIR='.output/public'
          elif [ -f '.output/public/_shell.html' ]; then
            cp '.output/public/_shell.html' '.output/public/index.html'
            WEB_DIR='.output/public'
          elif [ -f 'dist/index.html' ]; then
            mkdir -p '.output/public'
            cp 'dist/index.html' '.output/public/index.html'
            WEB_DIR='.output/public'
          else
            HTML_FILE=$(find .output -type f -name '*.html' -print -quit 2>/dev/null || true)
            if [ -n "$HTML_FILE" ]; then
              mkdir -p '.output/public'
              cp "$HTML_FILE" '.output/public/index.html'
              WEB_DIR='.output/public'
            else
              echo 'ERROR: No HTML shell generated by npm run build.'
              exit 1
            fi
          fi
          test -f "$WEB_DIR/index.html"
          echo "WEB_DIR=$WEB_DIR"
          echo '=== END WEB DIAGNOSTICS ==='
      - name: Generate Android project
        script: |
          set -euxo pipefail
          echo '=== CAPACITOR DIAGNOSTICS ==='
          node --version
          npm --version
          npx cap --version
          echo '--- capacitor config ---'
          cat capacitor.config.ts
          echo '--- installed Capacitor packages ---'
          npm ls @capacitor/cli @capacitor/core @capacitor/android --depth=0 || true
          rm -rf android
          echo '--- running cap add android ---'
          npx cap add android
          test -d android
          echo '--- running cap sync android ---'
          npx cap sync android --verbose
          echo '=== CAPACITOR DIAGNOSTICS COMPLETE ==='
      - name: Build debug APK
        script: |
          set -euxo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
