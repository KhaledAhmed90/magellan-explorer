workflows:
  android-apk:
    name: Magellan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build standalone Android web bundle
        script: |
          set -euxo pipefail
          npm run build:android
          test -f .output/public/index.html
          echo 'Android web bundle ready:'
          ls -lah .output/public/index.html
      - name: Generate Android project and sync
        script: |
          set -euxo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android --verbose
          test -d android
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - name: Build debug APK
        script: |
          set -euxo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lah app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
