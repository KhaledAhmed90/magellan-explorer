workflows:
  android-apk:
    name: Magellan Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build standalone Android web bundle
        script: |
          set -o pipefail
          rm -f android-web-build.log
          {
            echo '=== MAGELLAN ANDROID WEB BUILD ==='
            npm run build:android
            test -f .output/public/index.html
            find .output/public -maxdepth 3 -type f -print | sort
            echo '=== WEB BUILD PASSED ==='
          } 2>&1 | tee android-web-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -Ein 'error|err!|failed|cannot find|module not found|enoent|eacces|exception|caused by' android-web-build.log | tail -n 100 || true
            exit "$status"
          fi
      - name: Generate Android project
        script: |
          set -o pipefail
          rm -f capacitor-build.log
          {
            echo '=== CAPACITOR BUILD ==='
            rm -rf android
            npx cap add android
            npx cap sync android --verbose
            test -f android/app/build.gradle || test -f android/app/build.gradle.kts
            echo '=== CAPACITOR PASSED ==='
          } 2>&1 | tee capacitor-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -Ein 'error|err!|failed|cannot find|module not found|enoent|eacces|exception|caused by' capacitor-build.log | tail -n 120 || true
            exit "$status"
          fi
      - name: Build debug APK
        script: |
          set -o pipefail
          rm -f gradle-build.log
          {
            echo '=== GRADLE APK BUILD ==='
            cd android
            chmod +x gradlew
            echo '--- Gradle tasks relevant to APK ---'
            ./gradlew :app:tasks --all | grep -E 'assemble.*Debug|package.*Debug|bundle.*Debug' || true
            echo '--- app build configuration ---'
            sed -n '1,260p' app/build.gradle 2>/dev/null || sed -n '1,260p' app/build.gradle.kts
            echo '--- clean build ---'
            ./gradlew clean --no-daemon --stacktrace
            echo '--- explicit app debug package ---'
            ./gradlew :app:packageDebug --no-daemon --rerun-tasks --stacktrace --info
            echo '--- explicit app debug assemble ---'
            ./gradlew :app:assembleDebug --no-daemon --rerun-tasks --stacktrace --info
            echo '--- all APK outputs ---'
            find . -type f \( -name '*.apk' -o -name '*.aab' \) -print | sort
            echo '--- output directories ---'
            find . -type d -path '*/build/outputs/*' -print | sort
            APK_PATH=$(find . -type f -name '*.apk' -print -quit)
            if [ -z "$APK_PATH" ]; then
              echo 'ERROR: Gradle completed but no APK was generated by :app:packageDebug or :app:assembleDebug.'
              echo '--- debug-related Gradle tasks ---'
              ./gradlew :app:tasks --all | grep -Ei 'debug|apk|package|assemble' | tail -n 200 || true
              exit 1
            fi
            echo "FOUND APK: $APK_PATH"
            cp "$APK_PATH" ../magellan-debug.apk
            ls -lah ../magellan-debug.apk
            echo '=== APK BUILD PASSED ==='
          } 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '=== GRADLE FAILURE SUMMARY ==='
            grep -Ein 'error|failed|exception|caused by|could not|unable to|no such file|not found' ../gradle-build.log | tail -n 150 || true
            tail -n 220 ../gradle-build.log || true
          fi
          exit "$status"
    artifacts:
      - magellan-debug.apk
      - android-web-build.log
      - capacitor-build.log
      - gradle-build.log
